name: Build kobi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "sdkmanager not found, relying on preinstalled SDK"
          fi

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --console=plain > /tmp/test.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            # 1) 失败用例的断言详情（xUnit XML）：expected/actual 一目了然。
            #    放在最前，保证注解的前几行就是根因，而不是任务级噪音。
            : > /tmp/test-detail.txt
            if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
              python3 - <<'PYS' > /tmp/test-detail.txt 2>&1 || true
import glob, xml.etree.ElementTree as ET
for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
    root = ET.parse(f).getroot()
    for tc in root.iter('testcase'):
        for kind in ('failure', 'error'):
            for node in tc.iter(kind):
                msg = (node.get('message') or '').replace('\n', ' ').strip()
                print("FAILED " + str(tc.get('classname')) + "." + str(tc.get('name')) + ": " + msg[:400])
                for line in (node.text or '').strip().splitlines()[:8]:
                    print("  | " + line.strip()[:280])
PYS
            fi
            # 2) 构建/任务级错误摘要（编译错误与断言失败都要覆盖），写入 job summary 与注解，
            #    便于在无法下载日志时（例如无 token 的匿名 API 调用）仍能读到第一手信息。
            grep -E "^e: |error:|FAILURE: Build|What went wrong|Execution failed for task|Caused by:|> Task .*FAILED|Could not (resolve|find|determine)|[0-9]+ tests? completed, [0-9]+ failed|There were failing tests" /tmp/test.log \
              | head -40 > /tmp/test-build.txt || true
            if [ ! -s /tmp/test-build.txt ]; then tail -100 /tmp/test.log > /tmp/test-build.txt; fi
            cat /tmp/test-detail.txt /tmp/test-build.txt > /tmp/test-errors.txt

            {
              echo "## Unit tests failed - error summary"
              echo '```'
              cat /tmp/test-errors.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            cat /tmp/test-errors.txt
            head -20 /tmp/test-errors.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Unit test failure::$line"
            done
            exit 1
          fi
          echo "Unit tests passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug and release APK
        run: |
          set +e
          ./gradlew assembleDebug assembleRelease --stacktrace --console=plain > /tmp/build.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            # 提取编译错误摘要。写入 job summary 与注解，便于在无法下载日志时
            # （例如无 token 的匿名 API 调用）仍能读到第一手错误信息。
            grep -E "^e: |error:|FAILURE: Build|What went wrong|Execution failed for task|Caused by:|> Task .*FAILED|Could not (resolve|find|determine)" /tmp/build.log \
              | head -60 > /tmp/errors.txt || true
            if [ ! -s /tmp/errors.txt ]; then tail -100 /tmp/build.log > /tmp/errors.txt; fi

            {
              echo "## Build failed - error summary"
              echo '```'
              cat /tmp/errors.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            cat /tmp/errors.txt
            head -20 /tmp/errors.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Compile error::$line"
            done
            exit 1
          fi
          echo "Build succeeded" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/kobi-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/kobi-release.apk 2>/dev/null \
            || cp app/build/outputs/apk/release/app-release-unsigned.apk out/kobi-release.apk
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kobi-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
